spring:
  application:
    name: rental-mobil
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rental_mobil?createDatabaseIfNotExist=true&serverTimezone=Asia/Jakarta}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
server:
  port: ${PORT:8080}
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
